<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061e47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeûne & Prière">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jeûne & Prière</title>
<style>
/* Lanceur : bleu nuit et or, comme l'icône (mains en prière, croix lumineuse, couverts du jeûne). */
:root{--n1:#061e47;--n2:#12357a;--n3:#020c22;--flame:#f59e0b;--gold:#fbbf24;--ink:#fff;--soft:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.18);--bad:#fb7185;--ok:#34d399;
  --font:"Sansation","Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--n1);color:var(--ink);font-family:var(--font);overflow:hidden}
body{background:radial-gradient(120% 80% at 50% 0%,#17408f 0%,var(--n1) 55%,#020a1d 100%)}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f2fb;opacity:0;transition:opacity .45s ease;pointer-events:none}
#app.on{opacity:1;pointer-events:auto}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));text-align:center;transition:opacity .4s ease}
.scene.off{opacity:0;pointer-events:none}
.glow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.35),rgba(251,191,36,0) 65%);filter:blur(8px);animation:breathe 3.2s ease-in-out infinite;z-index:-1}
.logo{width:140px;height:140px;border-radius:34px;display:grid;place-items:center;background:#061e47;overflow:hidden;box-shadow:0 18px 50px rgba(251,191,36,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.logo img{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 10px rgba(251,191,36,.6));animation:shine 3.2s ease-in-out infinite}
h1{margin:0;font-size:28px;letter-spacing:.3px}
.verse{margin:-8px 0 0;color:var(--soft);font-size:14px;max-width:320px;font-style:italic}
.status{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--soft);min-height:24px}
.dots{display:inline-flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.card{width:100%;max-width:420px;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:12px;text-align:left;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card h2{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}
.card p{margin:0;color:var(--soft);font-size:14.5px;line-height:1.45}
.card .detail{font-size:12.5px;color:rgba(255,255,255,.55)}
.err{color:var(--bad)!important;font-size:13.5px!important;min-height:1em}
input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;font:inherit;font-size:14px;outline:none}
input:focus{border-color:var(--flame);box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-weight:700;font-size:15px;border-radius:14px;padding:12px 16px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button.fire{border:0;background:linear-gradient(135deg,var(--flame),var(--gold));color:#2a1204;box-shadow:0 8px 24px rgba(251,191,36,.35);flex:1;justify-content:center}
button:active{transform:translateY(1px)}
.link{background:none;border:0;padding:6px;color:rgba(255,255,255,.55);font-weight:400;font-size:13px;text-decoration:underline}
.foot{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:0;right:0;text-align:center}
#inst{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(6,30,71,.92);border:1px solid rgba(251,191,36,.5);box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
#inst[hidden]{display:none}
@media (max-width:700px){#inst{bottom:calc(84px + env(safe-area-inset-bottom))}}
#aide{position:fixed;inset:0;z-index:20;background:rgba(2,10,29,.72);display:flex;align-items:flex-end;justify-content:center;padding:12px}
#aide[hidden]{display:none}
#aide .sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#0b2a63,#061e47);border:1px solid rgba(251,191,36,.35);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
@media (min-width:700px){#aide{align-items:center}}
#rec{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,10,29,.86);backdrop-filter:blur(6px)}
#rec[hidden]{display:none}
#rec .box{width:100%;max-width:460px;background:linear-gradient(180deg,#0b2a63,#061e47);border:1px solid rgba(251,191,36,.4);border-radius:26px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#rec h2{margin:0;font-size:19px}
.micro{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:48px;background:radial-gradient(circle at 35% 30%,#fb7185,#e11d48);box-shadow:0 0 0 0 rgba(225,29,72,.6);animation:onde 1.6s infinite}
.micro.pause{animation:none;background:radial-gradient(circle at 35% 30%,#64748b,#334155)}
@keyframes onde{0%{box-shadow:0 0 0 0 rgba(225,29,72,.55)}70%{box-shadow:0 0 0 26px rgba(225,29,72,0)}100%{box-shadow:0 0 0 0 rgba(225,29,72,0)}}
#recT{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
#recTxt{width:100%;min-height:90px;max-height:32vh;overflow:auto;text-align:left;background:rgba(0,0,0,.25);border-radius:14px;padding:12px;font-size:15px;line-height:1.45;color:rgba(255,255,255,.9)}
#recTxt:empty::before{content:"Le texte dicté s'affiche ici…";color:rgba(255,255,255,.45)}
#recNote{font-size:13px;color:#fde68a;min-height:1em}
#rec .btns{width:100%}
#aide h2{margin:0;font-size:19px}
#aide ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.4}
#aide .warn{background:rgba(251,113,133,.15);border:1px solid rgba(251,113,133,.5);border-radius:14px;padding:10px 12px;font-size:14.5px}
#aide .diag{font-size:13px;color:rgba(255,255,255,.75);display:grid;gap:4px;background:rgba(0,0,0,.2);border-radius:14px;padding:10px 12px}
#aide .diag b{color:#fff}
#inst .go{border:0;border-radius:999px;padding:10px 16px;background:linear-gradient(135deg,var(--flame),var(--gold));color:#2a1204;font-size:14px}
#inst .x{border:0;background:none;color:rgba(255,255,255,.7);padding:8px 10px;font-size:16px}
@keyframes shine{0%,100%{transform:scale(1);filter:drop-shadow(0 4px 10px rgba(251,191,36,.45))}50%{transform:scale(1.05);filter:drop-shadow(0 4px 18px rgba(251,191,36,.85))}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<iframe id="app" title="Jeûne & Prière" allow="microphone; clipboard-read; clipboard-write; fullscreen"></iframe>

<section class="scene" id="scene">
  <div class="glow"></div>
  <div class="logo"><img src="icon-512.png" alt=""></div>
  <h1>Jeûne & Prière</h1>
  <p class="verse">« Mais cette sorte de démon ne sort que par la prière et par le jeûne. » — Matthieu 17:21</p>
  <div id="zone"></div>
</section>
<div id="rec" hidden><div class="box"><h2 id="recTitre">🎙 J'enregistre ta voix</h2><div class="micro" id="recMic">🎤</div><div id="recT">00:00</div>
<div id="recTxt"></div><div id="recNote"></div>
<div class="btns"><button class="fire" id="recFin" type="button">⏹ Terminer et garder</button><button id="recAnn" type="button">✕ Annuler</button></div></div></div>
<div id="aide" hidden><div class="sheet" id="aideIn"></div></div>
<div id="inst" hidden><button class="go" id="instGo" type="button">⬇ Installer l'appli</button><button class="x" id="instX" type="button" aria-label="Fermer">✕</button></div>
<div class="foot" id="foot" hidden><button class="link" id="chg" type="button">Changer de lien</button></div>

<script>
(function(){
"use strict";
/* Plusieurs applis (Jeûne & Prière, Boussole…) partagent la même adresse github.io : chaque clé est
   préfixée par le nom de l'appli et son dossier, pour qu'aucune n'écrase le lien de l'autre. */
var NS="jeune-priere|"+location.pathname.replace(/index\.html$/,"")+"|";
var LS={get:function(k){try{return localStorage.getItem(NS+k)||""}catch(e){return""}},
        set:function(k,v){try{v?localStorage.setItem(NS+k,v):localStorage.removeItem(NS+k)}catch(e){}}};
/* Le lien gardé doit être celui de Jeûne & Prière : on refuse un lien d'une autre appli. */
function lienAutreAppli(url){try{return url&&!/^https:\/\/script\.google\.com\//.test(url)}catch(e){return true}}
var DELAI=window.JP_DELAI||30000;                 // temps max pour que l'appli réponde
var $=function(id){return document.getElementById(id)};
var app=$("app"),scene=$("scene"),zone=$("zone"),foot=$("foot");
var minuteur=null,charge=false;
var esc=function(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};

/** Transforme n'importe quel lien reçu en adresse de l'appli : …/exec?k=… */
function cibleDepuis(txt){
  var u;try{u=new URL(String(txt||"").trim())}catch(e){return{err:"Ce n'est pas un lien complet : il doit commencer par https://"}}
  var api=u.searchParams.get("api")||"",k=u.searchParams.get("k")||"";
  if(!api&&/(^|\.)script\.google\.com$/.test(u.hostname))api=u.origin+u.pathname;
  if(/\/dev$/.test(api))return{err:"Ce lien finit par /dev : c'est l'adresse de test, elle ne marche que pour toi dans l'éditeur. Prends le lien du menu « Liens d'installation » du classeur."};
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(api))return{err:"Je ne trouve pas l'adresse du serveur dans ce lien (elle doit finir par /exec)."};
  if(!k)return{err:"Ce lien ne contient pas ta clé personnelle (…k=…)."};
  return{url:api+"?k="+encodeURIComponent(k),api:api,k:k}}

function memoriser(c){LS.set("jp_lanceur",c.url);
  // on garde le lien dans l'adresse : l'icône installée le retrouve toujours (utile sur iPhone)
  try{history.replaceState(null,"","?api="+encodeURIComponent(c.api)+"&k="+encodeURIComponent(c.k))}catch(e){}}

function montrer(html){charge=false;clearTimeout(minuteur);app.classList.remove("on");scene.classList.remove("off");zone.innerHTML=html}
function attente(txt){montrer('<div class="status"><span class="dots"><i></i><i></i><i></i></span><span>'+esc(txt)+'</span></div>');foot.hidden=false}

function ecranLien(msg){foot.hidden=true;
  montrer('<form class="card" id="f"><h2>🔗 Relier ton appli</h2>'+
    '<p>Colle ici <b>ton lien personnel</b>. Tu le trouves dans le classeur Google Sheets : menu <b>Jeûne & Prière › Liens d\'installation</b>.</p>'+
    '<input id="lien" inputmode="url" autocomplete="off" placeholder="https://…?api=…&k=…  ou  …/exec?k=…">'+
    '<p class="err" id="e">'+esc(msg||"")+'</p>'+
    '<div class="btns"><button class="fire" type="submit">✓ Relier</button></div></form>');
  $("f").addEventListener("submit",function(ev){ev.preventDefault();var c=cibleDepuis($("lien").value);
    if(c.err){$("e").textContent=c.err;return}memoriser(c);ouvrir()})}

function ecranHorsLigne(){foot.hidden=false;
  montrer('<div class="card"><h2>📴 Pas de réseau</h2><p>Ton téléphone n\'a pas Internet. Active le wifi ou les données mobiles : l\'appli s\'ouvrira toute seule dès que le réseau revient.</p>'+
    '<div class="btns"><button class="fire" id="r" type="button">↻ Réessayer</button></div></div>');
  $("r").onclick=demarrer}

function ecranLent(){foot.hidden=false;var url=LS.get("jp_lanceur");
  montrer('<div class="card"><h2>⚠️ Le serveur ne répond pas</h2><p>L\'appli n\'a pas répondu en '+Math.round(DELAI/1000)+' secondes. Le réseau est peut-être faible, ou le serveur a un souci.</p>'+
    '<p class="detail">Si ça dure : dans Apps Script, lance <b>testServeur</b> et vérifie le déploiement (Exécuter en tant que : Moi · Qui a accès : Tout le monde).</p>'+
    '<div class="btns"><button class="fire" id="r" type="button">↻ Réessayer</button><button id="b" type="button">↗ Ouvrir dans le navigateur</button></div></div>');
  $("r").onclick=demarrer;$("b").onclick=function(){location.href=url}}

function ouvrir(){var url=LS.get("jp_lanceur");if(lienAutreAppli(url)){LS.set("jp_lanceur","");url=""}if(!url){ecranLien();return}
  if(!navigator.onLine){ecranHorsLigne();return}
  attente("Ouverture de ton appli…");
  app.onload=function(){if(!app.getAttribute("src"))return;charge=true;clearTimeout(minuteur);
    app.classList.add("on");setTimeout(function(){if(charge){scene.classList.add("off");foot.hidden=true}},450)};
  minuteur=setTimeout(function(){if(!charge){app.removeAttribute("src");ecranLent()}},DELAI);
  app.src=url}

function demarrer(){
  var q=new URLSearchParams(location.search);
  if(q.get("api")||q.get("k")||q.get("go")){
    var c=cibleDepuis(q.get("go")||location.href);
    if(c.err){ecranLien(c.err);return}memoriser(c)}
  ouvrir()}

$("chg").onclick=function(){app.removeAttribute("src");LS.set("jp_lanceur","");try{history.replaceState(null,"",location.pathname)}catch(e){}ecranLien()};
window.addEventListener("online",function(){if(!charge)ouvrir()});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
/* Installation : bouton « Installer l'appli » + aide pas à pas selon l'appareil + diagnostic. */
var VERSION="Lanceur v10";
var invite=null,boite=$("inst"),aide=$("aide");
var UA=navigator.userAgent;
var installee=function(){return window.matchMedia("(display-mode: standalone)").matches||window.matchMedia("(display-mode: minimal-ui)").matches||window.navigator.standalone===true};
var appareil=function(){
  if(/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(UA))return"inapp";
  if(/iPhone|iPad|iPod/i.test(UA))return/CriOS/i.test(UA)?"ios-chrome":"ios";
  if(/Android/i.test(UA))return/SamsungBrowser/i.test(UA)?"samsung":"android";
  if(/Edg\//.test(UA))return"edge";
  if(/Firefox\//.test(UA))return"firefox";
  if(/Chrome\//.test(UA))return"chrome";
  return"autre"};
var ETAPES={
  inapp:'<div class="warn">⚠️ Le lien est ouvert <b>dans WhatsApp</b> (ou une autre appli) : on ne peut pas installer d\'ici.</div><ol><li>Touche <b>⋮</b> en haut à droite.</li><li>Choisis <b>Ouvrir dans Chrome</b> (ou « Ouvrir dans le navigateur »).</li><li>Dans Chrome, touche le bouton doré <b>⬇ Installer l\'appli</b>.</li></ol>',
  android:'<ol><li>Touche <b>⋮</b> en haut à droite de Chrome.</li><li>Choisis <b>Installer l\'application</b> ou <b>Ajouter à l\'écran d\'accueil</b>.</li><li>Si on te demande, choisis <b>Installer</b> (pas « Créer un raccourci »).</li><li>Ton icône apparaît sur l\'écran d\'accueil.</li></ol>',
  samsung:'<ol><li>Touche <b>☰</b> en bas à droite.</li><li><b>Ajouter la page à</b> › <b>Écran d\'accueil</b>.</li><li>Ou ouvre plutôt ce lien dans <b>Chrome</b> (conseillé).</li></ol>',
  ios:'<ol><li>Touche le bouton <b>Partager</b> (carré avec une flèche vers le haut).</li><li>Fais défiler et choisis <b>Sur l\'écran d\'accueil</b>.</li><li>Touche <b>Ajouter</b>.</li></ol>',
  "ios-chrome":'<ol><li>Touche le bouton <b>Partager</b> (dans la barre d\'adresse ou le menu ⋯).</li><li>Choisis <b>Sur l\'écran d\'accueil</b>.</li><li>Si ce choix n\'existe pas : ouvre le lien dans <b>Safari</b> et fais Partager › Sur l\'écran d\'accueil.</li></ol>',
  chrome:'<div class="warn" style="background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.5)">✅ Tu vois <b>« Open in app »</b> ou <b>« Ouvrir dans l\'application »</b> à droite de la barre d\'adresse ? Alors l\'appli est <b>déjà installée</b> sur ce PC : clique ce bouton, ou cherche « Jeûne & Prière » dans le menu Démarrer. Chrome ne propose pas d\'installer deux fois.</div><ol><li>Regarde à droite de la barre d\'adresse : clique l\'icône <b>écran avec une flèche ⤓</b> › <b>Installer</b>.</li><li>Sinon : menu <b>⋮</b> › <b>Caster, enregistrer et partager</b> › <b>Installer la page en tant qu\'appli</b>.</li><li>Toujours rien ? Menu <b>⋮</b> › <b>Caster, enregistrer et partager</b> › <b>Créer un raccourci</b> › coche <b>Ouvrir dans une fenêtre</b> › <b>Créer</b>. Le résultat est le même : une icône sur le bureau qui ouvre l\'appli dans sa fenêtre.</li></ol>',
  edge:'<div class="warn" style="background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.5)">Si Edge affiche « Ouvrir dans l\'application », l\'appli est déjà installée.</div><ol><li>Menu <b>⋯</b> › <b>Applications</b> › <b>Installer ce site en tant qu\'application</b>.</li><li>Clique <b>Installer</b>.</li></ol>',
  firefox:'<div class="warn">Firefox ne sait pas installer les applis web.</div><ol><li>Ouvre ce lien dans <b>Chrome</b> ou <b>Edge</b>.</li><li>Puis clique le bouton doré <b>⬇ Installer l\'appli</b>.</li></ol>',
  autre:'<ol><li>Ouvre ce lien dans <b>Chrome</b>.</li><li>Puis clique le bouton doré <b>⬇ Installer l\'appli</b>.</li></ol>'};
function diagnostic(cb){var L=[],ok=function(b,t){L.push((b?"✅ ":"❌ ")+t)};
  ok(location.protocol==="https:","Adresse sécurisée (https)");
  ok(!/script\.google\.com/.test(location.hostname),"Page du lanceur (github.io), pas le lien direct");
  ok(!installee(),installee()?"Déjà installée (tu es dans l'appli)":"Pas encore installée sur cet appareil");
  ok(!!invite,invite?"Chrome propose l'installation":"Chrome ne propose pas l'installation : souvent parce qu'elle est déjà installée (bouton « Open in app » dans la barre d'adresse)");
  var swp="serviceWorker" in navigator?navigator.serviceWorker.getRegistration():Promise.resolve(null);
  Promise.all([fetch("manifest.webmanifest",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}),
    new Promise(function(res){var i=new Image();i.onload=function(){res(i.naturalWidth)};i.onerror=function(){res(0)};i.src="icon-512.png?"+Date.now()}),swp])
  .then(function(v){var m=v[0];ok(!!m,m?"Fichier manifest.webmanifest trouvé":"Fichier manifest.webmanifest introuvable sur GitHub");
    if(m)ok(!!m.start_url,"Manifest à jour (start_url)");
    ok(v[1]>=512,v[1]?"Icône 512 trouvée":"icon-512.png introuvable sur GitHub");
    ok(!!v[2],v[2]?"Service worker actif":"Service worker pas actif (recharge la page une fois)");
    cb(L)})}
function ouvrirAide(){var d=appareil();
  $("aideIn").innerHTML='<h2>⬇ Installer l\'appli</h2>'+(ETAPES[d]||ETAPES.autre)+
    '<div class="diag" id="diag"><b>Vérification…</b></div><div class="btns"><button class="fire" id="aideOk" type="button">J\'ai compris</button></div>';
  aide.hidden=false;$("aideOk").onclick=function(){aide.hidden=true};
  diagnostic(function(L){$("diag").innerHTML="<b>Vérification ("+VERSION+")</b>"+L.map(function(x){return"<span>"+esc(x)+"</span>"}).join("")})}
aide.addEventListener("click",function(e){if(e.target===aide)aide.hidden=true});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();invite=e;if(!installee())boite.hidden=false});
$("instGo").onclick=function(){
  if(invite){invite.prompt();invite.userChoice.then(function(c){invite=null;if(c&&c.outcome==="accepted")boite.hidden=true;else ouvrirAide()})}
  else ouvrirAide()};
$("instX").onclick=function(){boite.hidden=true;LS.set("jp_inst_x","1")};
window.addEventListener("appinstalled",function(){boite.hidden=true;invite=null;aide.hidden=true});
// le bouton apparaît aussi quand Chrome ne propose rien : il ouvre alors l'aide pas à pas
setTimeout(function(){if(!installee()&&LS.get("jp_inst_x")!=="1")boite.hidden=false},2500);
if(new URLSearchParams(location.search).has("aide"))setTimeout(ouvrirAide,300);
/* ===== Dictée et enregistrement de la voix pour l'appli =====
   L'appli tourne dans un cadre Google qui n'a pas le droit d'utiliser le micro.
   Le lanceur, lui, l'a : l'appli lui demande d'enregistrer, il renvoie le texte et l'audio. */
var REC={src:null,origin:"",id:"",flux:null,mr:null,morceaux:[],sr:null,actif:false,t0:0,tic:null,texte:"",provisoire:"",audioVoulu:true,max:15*60};
var recBox=$("rec"),recT=$("recT"),recTxt=$("recTxt"),recNote=$("recNote"),recMic=$("recMic");
function mmss(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function afficherTexte(){recTxt.textContent=(REC.texte+" "+REC.provisoire).trim()}
function renvoyer(msg){try{REC.src&&REC.src.postMessage(Object.assign({jp:"dictee-fin",id:REC.id},msg),REC.origin||"*")}catch(e){}}
function arreterTout(){REC.actif=false;clearInterval(REC.tic);try{REC.sr&&REC.sr.stop()}catch(e){}
  try{REC.flux&&REC.flux.getTracks().forEach(function(t){t.stop()})}catch(e){}}
function lancerReco(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){recNote.textContent="Ce navigateur n'écrit pas le texte tout seul : l'audio est quand même enregistré.";return}
  var r=new SR();r.lang="fr-FR";r.continuous=true;r.interimResults=true;REC.sr=r;
  r.onresult=function(ev){var tmp="";for(var k=ev.resultIndex;k<ev.results.length;k++){var t=ev.results[k][0].transcript;if(ev.results[k].isFinal)REC.texte=(REC.texte+" "+t).trim();else tmp+=t}REC.provisoire=tmp;afficherTexte()};
  r.onerror=function(ev){if(ev.error==="not-allowed"||ev.error==="service-not-allowed"||ev.error==="audio-capture"){REC.sr=null;recNote.textContent=REC.mr?"Le texte ne peut pas s'écrire en même temps sur cet appareil : l'audio est bien enregistré, tu pourras l'écouter et l'écrire.":"Micro refusé : autorise le micro pour ce site (cadenas à gauche de l'adresse)."}};
  r.onend=function(){REC.provisoire="";afficherTexte();if(REC.actif&&REC.sr){try{r.start()}catch(e){}}};   // Android s'arrête aux silences : on relance
  try{r.start()}catch(e){}}
function ouvrirEnregistreur(m,source,origin){
  if(REC.actif){return}
  REC.src=source;REC.origin=origin;REC.id=m.id||"";REC.texte="";REC.provisoire="";REC.morceaux=[];REC.mr=null;REC.sr=null;REC.audioVoulu=m.audio!==false;
  $("recTitre").textContent=REC.audioVoulu?"🎙 J'enregistre ta voix":"🎤 Dictée";recNote.textContent="";recTxt.textContent="";recT.textContent="00:00";recMic.classList.remove("pause");recBox.hidden=false;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){recNote.textContent="Ce navigateur ne permet pas d'utiliser le micro.";return}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(flux){
    REC.flux=flux;REC.actif=true;REC.t0=Date.now();
    if(REC.audioVoulu&&window.MediaRecorder){var types=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"],type="";
      for(var i=0;i<types.length;i++)if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(types[i])){type=types[i];break}
      try{REC.mr=new MediaRecorder(flux,type?{mimeType:type,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000})}catch(e){REC.mr=new MediaRecorder(flux)}
      REC.mr.ondataavailable=function(e){if(e.data&&e.data.size)REC.morceaux.push(e.data)};REC.mr.start(1000)}
    lancerReco();
    REC.tic=setInterval(function(){var s=(Date.now()-REC.t0)/1000;recT.textContent=mmss(s);if(s>=REC.max){terminer()}},250);
  }).catch(function(){recMic.classList.add("pause");recNote.textContent="Micro refusé. Touche le cadenas à gauche de l'adresse › Micro › Autoriser, puis réessaie. Sinon, utilise « 📎 Audio du téléphone » dans l'appli."})}
function terminer(){if(!REC.actif&&!REC.flux){recBox.hidden=true;renvoyer({annule:true,erreur:recNote.textContent});return}
  var duree=Math.round((Date.now()-REC.t0)/1000);var texte=(REC.texte+" "+REC.provisoire).trim();arreterTout();recMic.classList.add("pause");
  var fin=function(audio){recBox.hidden=true;REC.flux=null;renvoyer({texte:texte,audio:audio,duree:duree})};
  if(REC.mr&&REC.mr.state!=="inactive"){var mr=REC.mr;mr.onstop=function(){var blob=new Blob(REC.morceaux,{type:mr.mimeType||"audio/webm"});
      if(!blob.size){fin(null);return}var fr=new FileReader();fr.onload=function(){var b64=String(fr.result).split(",")[1];fin({mime:blob.type.split(";")[0]||"audio/webm",b64:b64,taille:blob.size})};fr.readAsDataURL(blob)};
    try{mr.stop()}catch(e){fin(null)}}
  else fin(null)}
$("recFin").onclick=terminer;
$("recAnn").onclick=function(){arreterTout();REC.flux=null;recBox.hidden=true;renvoyer({annule:true})};
window.addEventListener("message",function(e){
  var hote="";try{hote=new URL(e.origin).hostname}catch(x){return}
  if(!/(^|\.)googleusercontent\.com$|(^|\.)script\.google\.com$/.test(hote))return;   // seulement ton appli
  var m=e.data||{};
  if(m.jp==="ping-lanceur"){try{e.source.postMessage({jp:"lanceur-ok",v:VERSION},e.origin)}catch(x){}}
  else if(m.jp==="dictee")ouvrirEnregistreur(m,e.source,e.origin);
  else if(m.jp==="recharger"){location.reload()}   // nouvelle version de l'appli : on recharge tout
});
demarrer();
})();
</script>
